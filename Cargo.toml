[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "apps/server",
  "crates/app",
  "crates/audio",
  "crates/core",
  "crates/credentials",
  "crates/exporters",
  "crates/providers",
  "crates/storage",
  "tests/integration",
]
default-members = [
  "apps/server",
  "crates/app",
  "crates/audio",
  "crates/core",
  "crates/credentials",
  "crates/exporters",
  "crates/providers",
  "crates/storage",
  "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/justicetwtw/meeting-intelligence"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
# OS-native credential storage. Feature-gated so mock mode and CI never link a
# platform credential manager.
keyring = { version = "4.1", default-features = false, features = ["v1"] }
# Only the concrete OpenAI provider enables this. Mock mode compiles without it
# so the offline pipeline cannot make a network call.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "multipart",
  "rustls-tls",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.42", features = [
  "fs",
  "macros",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zeroize = "1.8"
# Pure-Rust deflate only: no C toolchain, no encryption, no archive formats the
# exporter does not need.
zip = { version = "8", default-features = false, features = [
  "deflate-flate2-zlib-rs",
] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
