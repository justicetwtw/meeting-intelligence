name: Bug report
description: Report a reproducible non-security defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities or include private meeting data here. Use private vulnerability reporting for security issues.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest synthetic reproduction.
      placeholder: Steps, mock fixture, and command...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Meeting Core / Rust
        - Desktop / TypeScript
        - Local AI / Python
        - Slack foundation
        - CI / release
        - Documentation
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted diagnostics
      description: Remove tokens, authorization headers, meeting content, and personal data.
