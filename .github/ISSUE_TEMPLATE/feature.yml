name: Feature proposal
description: Propose a scoped capability or contract change
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or developer problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe behavior, not just a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Architecture and privacy impact
      description: Which contracts, trust boundaries, or data classes are affected?
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Acceptance tests
      description: How can this be verified deterministically in mock mode?
    validations:
      required: true
