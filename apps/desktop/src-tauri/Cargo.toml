[package]
name = "meeting-intelligence-desktop"
description = "Tauri 2 native boundary for Meeting Intelligence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "meeting_intelligence_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[[bin]]
name = "meeting-intelligence-desktop"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build.workspace = true

[dependencies]
meeting-intelligence-app = { path = "../../../crates/app", features = ["openai"] }
meeting-intelligence-core = { path = "../../../crates/core" }
meeting-intelligence-credentials = { path = "../../../crates/credentials", features = [
  "os-store",
] }
meeting-intelligence-storage = { path = "../../../crates/storage" }
serde.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
meeting-intelligence-providers = { path = "../../../crates/providers" }

[lints]
workspace = true
