[package]
name = "meeting-intelligence-credentials"
description = "Secret handling and OS-native credential storage for Meeting Intelligence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# The OS-native store is opt-in so mock mode, CI, and headless tests never link
# or touch a platform credential manager.
os-store = ["dep:keyring"]

[dependencies]
keyring = { workspace = true, optional = true }
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
